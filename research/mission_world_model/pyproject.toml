[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-mission-world-model"
version = "0.1.0"
description = "Observation-built Gaussian memory and mission-configured UAV prediction"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
